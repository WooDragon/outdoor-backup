name: Build and Release IPK

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  PACKAGE_NAME: outdoor-backup
  LUCI_PACKAGE_NAME: luci-app-outdoor-backup
  OPENWRT_VERSION: 23.05.5

jobs:
  behavior:
    name: Run OpenWrt behavior suites
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run bounded runner unit tests
        run: python3 tests/test-run-local-container.py

      - name: Run live-progress UI behavior tests
        run: |
          node --version
          node test-live-progress-ui.js
          node test-target-selection-ui.js

      - name: Run pinned OpenWrt behavior suites
        run: bash tests/run-ci.sh "$GITHUB_WORKSPACE/evidence-$GITHUB_SHA"

      - name: Archive behavior evidence
        if: always()
        run: |
          if [ -d "$GITHUB_WORKSPACE/evidence-$GITHUB_SHA" ]; then
            sudo tar -C "$GITHUB_WORKSPACE" -czf - "evidence-$GITHUB_SHA" > "$RUNNER_TEMP/behavior-evidence-$GITHUB_SHA.tar.gz"
          else
            echo "No behavior-suite evidence directory exists; no archive will be uploaded."
          fi

      - name: Upload behavior evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behavior-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/behavior-evidence-${{ github.sha }}.tar.gz
          if-no-files-found: warn
          retention-days: 30

  build:
    name: Build IPK Packages
    needs: behavior
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - arch: x86-64
            target: x86
            subtarget: 64
          - arch: aarch64_cortex-a53
            target: rockchip
            subtarget: armv8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git libssl-dev gettext unzip file wget

      - name: Download OpenWrt SDK
        run: |
          SDK_URL="https://downloads.openwrt.org/releases/${{ env.OPENWRT_VERSION }}/targets/${{ matrix.target }}/${{ matrix.subtarget }}/openwrt-sdk-${{ env.OPENWRT_VERSION }}-${{ matrix.target }}-${{ matrix.subtarget}}_gcc-12.3.0_musl.Linux-x86_64.tar.xz"
          echo "Downloading SDK from: $SDK_URL"
          wget -q "$SDK_URL" -O sdk.tar.xz
          tar -xf sdk.tar.xz
          SDK_DIR=$(ls -d openwrt-sdk-* | head -1)
          mv "$SDK_DIR" sdk
          echo "SDK extracted to: sdk/"
          ls -la sdk/

      - name: Stage complete feed snapshot
        run: |
          FEED_STAGE=$(mktemp -d "$RUNNER_TEMP/outdoor-feed.XXXXXX")
          git archive --format=tar HEAD | tar -x -C "$FEED_STAGE"
          test -f "$FEED_STAGE/outdoor-backup/Makefile" || {
            echo "Canonical outdoor-backup recipe is missing from feed snapshot: $FEED_STAGE" >&2
            exit 1
          }
          test -f "$FEED_STAGE/luci-app-outdoor-backup/Makefile" || {
            echo "LuCI recipe is missing from feed snapshot: $FEED_STAGE" >&2
            exit 1
          }
          printf 'FEED_STAGE=%s\n' "$FEED_STAGE" >> "$GITHUB_ENV"
          echo "Staged complete tracked feed snapshot at: $FEED_STAGE"

      - name: Update and install feeds
        run: |
          test -d "$FEED_STAGE" || {
            echo "Feed snapshot directory is unavailable: $FEED_STAGE" >&2
            exit 1
          }
          printf 'src-link outdoor %s\n' "$FEED_STAGE" >> sdk/feeds.conf.default
          cd sdk
          ./scripts/feeds update -a

          feed_index=feeds/outdoor.index
          test -s "$feed_index" || {
            echo "Feed index is empty or missing after update: $feed_index" >&2
            exit 1
          }
          for package in outdoor-backup luci-app-outdoor-backup; do
            grep -F -x -q "Package: $package" "$feed_index" || {
              echo "Required package is absent from $feed_index: $package" >&2
              exit 1
            }
          done

          ./scripts/feeds install -a
          for package in outdoor-backup luci-app-outdoor-backup; do
            package_makefile="package/feeds/outdoor/$package/Makefile"
            test -f "$package_makefile" && test -r "$package_makefile" || {
              echo "Feed-installed package Makefile is unavailable: $package_makefile" >&2
              exit 1
            }
          done

      - name: Configure SDK
        run: |
          set -euo pipefail
          cd sdk
          # SDK defaults select every package; keep only the two packages under test and their dependencies.
          printf '%s\n' \
            '# CONFIG_ALL is not set' \
            '# CONFIG_ALL_NONSHARED is not set' \
            '# CONFIG_ALL_KMODS is not set' \
            'CONFIG_PACKAGE_outdoor-backup=y' \
            'CONFIG_PACKAGE_luci-app-outdoor-backup=y' > .config
          make defconfig
          for symbol in ALL ALL_NONSHARED ALL_KMODS; do
            grep -F -x -q "# CONFIG_${symbol} is not set" .config || {
              printf 'SDK unexpectedly enables CONFIG_%s\n' "$symbol" >&2
              exit 1
            }
          done
          for package in outdoor-backup luci-app-outdoor-backup; do
            grep -F -x -q "CONFIG_PACKAGE_${package}=y" .config || {
              printf 'SDK dropped required package: %s\n' "$package" >&2
              exit 1
            }
          done

      - name: Verify BusyBox capability selection
        run: |
          config_file=sdk/.config
          test -r "$config_file" || {
            echo "SDK configuration is unavailable: $config_file" >&2
            exit 1
          }
          if grep -F -x -q 'CONFIG_BUSYBOX_CUSTOM=y' "$config_file"; then
            busybox_namespace=BUSYBOX_CONFIG
          else
            busybox_namespace=BUSYBOX_DEFAULT
          fi
          for capability in SETSID FLOCK; do
            symbol="CONFIG_${busybox_namespace}_${capability}"
            grep -F -x -q "${symbol}=y" "$config_file" || {
              echo "Required BusyBox capability is disabled: ${symbol}" >&2
              exit 1
            }
            printf 'Verified BusyBox symbol: %s=y\n' "$symbol"
          done

      - name: Build outdoor-backup
        run: |
          cd sdk
          make package/feeds/outdoor/outdoor-backup/compile V=s -j$(nproc)

      - name: Build luci-app-outdoor-backup
        run: |
          cd sdk
          make package/feeds/outdoor/luci-app-outdoor-backup/compile V=s -j$(nproc)

      - name: Verify outdoor-backup IPK metadata
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t core_ipks < <(find sdk/bin/packages -type f -name 'outdoor-backup_*.ipk' -print)
          [ "${#core_ipks[@]}" -eq 1 ] || {
            printf 'Expected exactly one core IPK, found %s\n' "${#core_ipks[@]}" >&2
            printf '%s\n' "${core_ipks[@]}" >&2
            exit 1
          }
          mapfile -t package_versions < <(sed -n 's/^PKG_VERSION:=//p' outdoor-backup/Makefile)
          mapfile -t package_releases < <(sed -n 's/^PKG_RELEASE:=//p' outdoor-backup/Makefile)
          [ "${#package_versions[@]}" -eq 1 ] && [ -n "${package_versions[0]}" ] || {
            echo 'Package recipe must contain exactly one non-empty PKG_VERSION' >&2
            exit 1
          }
          [ "${#package_releases[@]}" -eq 1 ] && [ -n "${package_releases[0]}" ] || {
            echo 'Package recipe must contain exactly one non-empty PKG_RELEASE' >&2
            exit 1
          }
          expected_version="${package_versions[0]}-${package_releases[0]}"
          control_file=$(mktemp)
          trap 'rm -f "$control_file"' EXIT
          tar -xOzf "${core_ipks[0]}" ./control.tar.gz | tar -xOzf - ./control > "$control_file"
          grep -F -x -q 'Package: outdoor-backup' "$control_file"
          grep -F -x -q "Version: $expected_version" "$control_file"
          depends=$(sed -n 's/^Depends: //p' "$control_file")
          [ -n "$depends" ] || {
            echo 'Core IPK control file has no Depends field' >&2
            exit 1
          }
          has_rsync=false
          has_jq=false
          while IFS= read -r dependency; do
            dependency="${dependency#"${dependency%%[![:space:]]*}"}"
            case "$dependency" in
              BUSYBOX_*)
                printf 'Unexpected BusyBox runtime dependency: %s\n' "$dependency" >&2
                exit 1
                ;;
              rsync) has_rsync=true ;;
              jq) has_jq=true ;;
            esac
          done < <(printf '%s\n' "$depends" | tr ',' '\n')
          [ "$has_rsync" = true ] || { echo 'Core IPK Depends lost rsync' >&2; exit 1; }
          [ "$has_jq" = true ] || { echo 'Core IPK Depends lost jq' >&2; exit 1; }
          printf 'Verified core IPK metadata: %s\n' "${core_ipks[0]}"

      - name: Run ShellCheck validation
        run: |
          echo "Running ShellCheck on all shell scripts..."
          # .shellcheckrc configures: shell=ash, excludes false positives (SC3043, SC2034)
          # --severity=error: Only fail on actual errors, not style suggestions
          shellcheck --severity=error \
            files/opt/outdoor-backup/scripts/*.sh \
            files/etc/hotplug.d/block/90-outdoor-backup \
            files/etc/init.d/outdoor-backup
          echo "✓ All shell scripts passed ShellCheck (ash dialect, errors only)"

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          # Only collect our packages, not dependencies
          find sdk/bin/packages/ \( -name "outdoor-backup_*.ipk" -o -name "luci-app-outdoor-backup_*.ipk" \) -exec cp {} artifacts/ \;

          echo "Collected artifacts:"
          ls -lh artifacts/

          # Rename with architecture
          cd artifacts
          for ipk in *.ipk; do
            mv "$ipk" "${ipk%.ipk}_${{ matrix.arch }}.ipk"
          done
          ls -lh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-packages-${{ matrix.arch }}
          path: artifacts/*.ipk
          retention-days: 30

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write  # Required to create releases and delete old releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize artifacts
        run: |
          mkdir -p release-assets
          # Only collect our packages, not dependencies
          find artifacts \( -name "outdoor-backup_*.ipk" -o -name "luci-app-outdoor-backup_*.ipk" \) -exec cp {} release-assets/ \;
          echo "Release artifacts:"
          ls -lh release-assets/

      - name: Extract version from Makefile
        id: version
        run: |
          VERSION=$(grep "^PKG_VERSION:=" outdoor-backup/Makefile | cut -d'=' -f2)
          RELEASE=$(grep "^PKG_RELEASE:=" outdoor-backup/Makefile | cut -d'=' -f2)
          FULL_VERSION="${VERSION}-${RELEASE}"
          echo "version=${FULL_VERSION}" >> $GITHUB_OUTPUT
          echo "Extracted version: $FULL_VERSION"

      - name: Generate release notes
        run: |
          cat > release_notes.md <<'EOF'
          ## OpenWrt SD Card Backup System

          Auto-built IPK packages for outdoor-backup system.

          ### 📦 Packages

          Built for multiple architectures:
          - `outdoor-backup_*_x86-64.ipk` - x86_64 architecture (Core system)
          - `outdoor-backup_*_aarch64_cortex-a53.ipk` - ARM64 architecture (Core system)
          - `luci-app-outdoor-backup_*_all.ipk` - WebUI (architecture-independent)

          ### ✅ Supported Architectures

          - **ARM64** (NanoPi R5S, R4S, R6S, etc.) - Use `*_aarch64_cortex-a53.ipk`
          - **x86_64** (Soft routers, VMs) - Use `*_x86-64.ipk`

          ### 📥 Installation

          ```bash
          # Step 1: Install dependencies
          opkg update
          opkg install rsync block-mount kmod-usb-storage \
                       kmod-fs-ext4 kmod-fs-vfat kmod-fs-exfat kmod-fs-ntfs3

          # Step 2: Install core package (choose your architecture)
          # For ARM64 (R5S, R4S, etc.):
          opkg install outdoor-backup_*_aarch64_cortex-a53.ipk
          # For x86_64:
          opkg install outdoor-backup_*_x86-64.ipk

          # Step 3: Install WebUI (architecture-independent)
          opkg install luci-app-outdoor-backup_*_all.ipk
          ```

          ### 🔍 Verification

          ```bash
          # Check service status
          /etc/init.d/outdoor-backup status

          # View logs
          logread -f | grep outdoor-backup

          # Access WebUI
          # http://router-ip/cgi-bin/luci/admin/services/outdoor-backup
          ```

          ### 🛠️ Requirements

          - OpenWrt 19.07+ or Lean's LEDE
          - Internal storage (SSD/HDD/eMMC) for backup destination
          - USB port for SD card readers
          - Required kernel modules (install via opkg as shown above)

          ### ✨ Features

          - Automatic hotplug-triggered backups
          - Incremental rsync with `--ignore-existing`
          - LED status indication
          - Concurrent backup protection (PID lock)
          - Support for multiple filesystems (ext4/exFAT/NTFS/FAT32)
          - Primary and Replica backup modes
          - WebUI management with real-time monitoring

          ### 📝 Build Info

          - Built with: OpenWrt SDK ${{ env.OPENWRT_VERSION }}
          - ShellCheck: Passed (ash dialect, OpenWrt-aware)
          - Version: ${{ steps.version.outputs.version }}
          - Commit: ${{ github.sha }}
          - Architectures: x86-64, aarch64_cortex-a53

          ---

          For documentation, visit: https://github.com/${{ github.repository }}
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release_notes.md
          files: release-assets/*.ipk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up old releases
        uses: dev-drprasad/delete-older-releases@v0.3.0
        with:
          keep_latest: 5
          delete_tags: true
          delete_tag_pattern: v
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build summary
        run: |
          echo "### ✅ Build Completed Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Packages built:**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for ipk in release-assets/*.ipk; do
            echo "- \`$(basename $ipk)\` ($(du -h "$ipk" | cut -f1))" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**ShellCheck:** ✓ Passed (ash dialect)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release:** Created at ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
