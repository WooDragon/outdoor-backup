# OpenWrt SD Card Backup System Configuration
#
# This file contains global settings for the backup system.
# Per-SD card settings are stored on each SD card in FieldBackup.conf

# === Storage Settings ===

# Root directory for all backups. It must be a strict child of TARGET_MOUNT.
BACKUP_ROOT="/mnt/ssd/SDMirrors"

# Mounted target storage root. The manager pins this mount by an open directory
# descriptor before it accepts an add event; do not point it at the SD source.
TARGET_MOUNT="/mnt/ssd"

# Expected blkid UUID for TARGET_MOUNT. Leave empty only while configuring the
# package: add events are rejected until this is set, rather than guessing.
TARGET_UUID=""

# Temporary mount point for SD cards
MOUNT_POINT="/mnt/sdcard"

# === Performance Settings ===

# Maximum concurrent backup operations
# Set to 1 for safety, increase if CPU/storage can handle it
MAX_CONCURRENT=1

# rsync bandwidth limit in KB/s (0 = unlimited)
BANDWIDTH_LIMIT=0

# rsync compression (yes/no)
# Enable for slow storage, disable for fast SSD
USE_COMPRESSION=no

# === Safety Settings ===

# Minimum free space required on target (MB).
# The backup is refused (with the "no space" LED pattern, 3 red flashes) when
# the target filesystem has less than this free. This is an O(1) df check on
# the target — NOT a whole-card scan — so incremental re-backups of a nearly
# full card proceed as long as the target has at least this much headroom.
MIN_FREE_SPACE=1024

# Maximum backup retries on failure
MAX_RETRIES=3

# Retry delay in seconds
RETRY_DELAY=10

# === Card Reader Detection (issue #2) ===
#
# By default the system identifies SD cards/readers with a built-in heuristic
# (device path + model string + size threshold). That heuristic mis-fires as
# media evolves: 1TB+ cards trip the size cap, and some readers (Lexar,
# Angelbird, ProGrade) have sysfs paths without the usual "usb/card" keywords.
#
# To detect specific readers reliably, list them below. A whitelist match is
# checked FIRST (exact, authoritative); the heuristic runs only as fallback.

# USB VID:PID whitelist, space-separated, lowercase hex "vvvv:pppp".
# Find yours with:  lsusb            (look for your card reader)
#               or: cat /sys/bus/usb/devices/*/idVendor /sys/bus/usb/devices/*/idProduct
# Example: CARD_READER_USB_IDS="05e3:0749 14cd:1212"
CARD_READER_USB_IDS=""

# Device-path prefix whitelist, space-separated. Matched against the hotplug
# DEVPATH (under /sys). Use when a reader has a stable path but no USB ID match.
# Example: CARD_READER_PATH_PREFIXES="/devices/platform/soc/usb1"
CARD_READER_PATH_PREFIXES=""

# Keep the built-in heuristic as a fallback when the whitelist doesn't match.
# "yes" (default): whitelist first, then heuristic — safe for existing setups.
# "no": ONLY whitelisted devices trigger backups (strict; nothing else fires).
CARD_READER_HEURISTIC_FALLBACK="yes"

# === Logging Settings ===

# Enable debug logging (0=off, 1=on)
DEBUG=0

# Log rotation size in KB
LOG_MAX_SIZE=10240

# Number of old logs to keep
LOG_ROTATE_COUNT=10

# === LED Settings ===
# Adjust these paths for your specific hardware
# Common R5S paths:
#   - /sys/class/leds/green:lan
#   - /sys/class/leds/red:sys
#   - /sys/class/leds/blue:wan

# Green LED for normal operations
LED_GREEN="/sys/class/leds/green:lan"

# Red LED for errors
LED_RED="/sys/class/leds/red:sys"

# LED blink rates (milliseconds)
LED_FAST_BLINK=100
LED_SLOW_BLINK=500

# === File Filters ===
# Files/directories to exclude from backup

EXCLUDE_PATTERNS="
.Trash*
.Spotlight*
.fseventsd
System Volume Information
\$RECYCLE.BIN
.DS_Store
Thumbs.db
*.tmp
*.TMP
~*
"

# === Advanced Settings ===

# rsync extra options
# Add custom rsync flags here
RSYNC_EXTRA_OPTS=""

# Pre-backup hook script (optional)
# Run custom commands before backup starts
PRE_BACKUP_HOOK=""

# Post-backup hook script (optional)
# Run custom commands after backup completes
POST_BACKUP_HOOK=""
