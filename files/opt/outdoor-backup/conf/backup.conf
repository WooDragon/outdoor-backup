# OpenWrt SD Card Backup System Configuration
#
# This file contains global settings for the backup system.
# Per-SD card settings are stored on each SD card in FieldBackup.conf

# === Storage Settings ===

# Root directory for all backups. It must be a strict child of TARGET_MOUNT.
BACKUP_ROOT="/mnt/ssd/SDMirrors"

# Mounted target storage root. The manager pins this mount by an open directory
# descriptor before it accepts an add event; do not point it at the SD source.
TARGET_MOUNT="/mnt/ssd"

# Expected blkid UUID for TARGET_MOUNT. Leave empty only while configuring the
# package: add events are rejected until this is set, rather than guessing.
TARGET_UUID=""

# Temporary mount point for SD cards
MOUNT_POINT="/mnt/sdcard"

# === Performance Settings ===

# Maximum concurrent backup operations
# Set to 1 for safety, increase if CPU/storage can handle it
MAX_CONCURRENT=1

# rsync bandwidth limit in KB/s (0 = unlimited)
BANDWIDTH_LIMIT=0

# rsync compression (yes/no)
# Enable for slow storage, disable for fast SSD
USE_COMPRESSION=no

# === Safety Settings ===

# Minimum free space required on target (MB).
# The backup is refused (with the "no space" LED pattern, 3 red flashes) when
# the target filesystem has less than this free. This is an O(1) df check on
# the target — NOT a whole-card scan — so incremental re-backups of a nearly
# full card proceed as long as the target has at least this much headroom.
MIN_FREE_SPACE=1024

# Maximum backup retries on failure
MAX_RETRIES=3

# Retry delay in seconds
RETRY_DELAY=10

# === Card Reader Detection (issue #2) ===
#
# By default the system identifies SD cards/readers with a built-in heuristic
# (device path + model string + size threshold). That heuristic mis-fires as
# media evolves: 1TB+ cards trip the size cap, and some readers (Lexar,
# Angelbird, ProGrade) have sysfs paths without the usual "usb/card" keywords.
#
# To detect specific readers reliably, list them below. A whitelist match is
# checked FIRST (exact, authoritative); the heuristic runs only as fallback.
#
# These three options are also settable via UCI:
#   uci set outdoor-backup.config.card_reader_usb_ids='05e3:0749 14cd:1212'
#   uci set outdoor-backup.config.card_reader_path_prefixes='/devices/platform/soc/usb1'
#   uci set outdoor-backup.config.card_reader_heuristic_fallback='no'
#   uci commit outdoor-backup
# When the UCI option is explicitly present it wins over the value set here;
# this file remains the lower-priority legacy layer either way.

# USB VID:PID whitelist, space-separated, lowercase hex "vvvv:pppp".
# Find yours with:  lsusb            (look for your card reader)
#               or: cat /sys/bus/usb/devices/*/idVendor /sys/bus/usb/devices/*/idProduct
# Example: CARD_READER_USB_IDS="05e3:0749 14cd:1212"
CARD_READER_USB_IDS=""

# Device-path prefix whitelist, space-separated. Matched against the hotplug
# DEVPATH (under /sys). Use when a reader has a stable path but no USB ID match.
# Example: CARD_READER_PATH_PREFIXES="/devices/platform/soc/usb1"
CARD_READER_PATH_PREFIXES=""

# Keep the built-in heuristic as a fallback when the whitelist doesn't match.
# "yes" (default): whitelist first, then heuristic — safe for existing setups.
# "no": ONLY whitelisted devices trigger backups (strict; nothing else fires).
CARD_READER_HEURISTIC_FALLBACK="yes"

# === Logging Settings ===

# Enable debug logging (0=off, 1=on)
DEBUG=0

# Log rotation size in KB
LOG_MAX_SIZE=10240

# Number of old logs to keep
LOG_ROTATE_COUNT=10

# === LED Settings ===
# Four-lamp state machine (issue #40): one red status LED plus three green
# progress/segment LEDs. Defaults below target the R5S onboard LEDs
# (red:power, green:wan, green:lan-1, green:lan-2) -- other boards must
# adjust every path to their own real /sys/class/leds/ names.
#
# Any of the four may be left as an empty string ("") to mean "no LED wired
# for this slot"; that is the only case that is a legal, silent no-op (see
# led_set in common.sh). A NON-empty path that does not exist on the board
# is NOT silent: it is a real misconfiguration and led_set reports it via
# "logger -p err" (PR #41 review finding 7) -- it never writes an
# application log file, but it is not silent on the system log either.
#
# This file is a plain shell-sourced legacy fallback, so an actual empty
# string above works directly. The UCI config path does NOT have this
# option: raw UCI drops a genuinely empty option value at parse time and
# cannot tell "explicitly blank" apart from "never set" (PR #41 review
# finding 4). When configuring via `uci set outdoor-backup.config.led_green=...`
# or the LuCI form, use the literal value "none" instead of an empty
# string -- config_load's config_resolve_led_sentinel() folds "none" back
# to empty before use.

# Red LED: error indicator only. Never touched on success paths.
LED_RED="/sys/class/leds/red:power"

# Green LED 1: progress segment 0-33% / completion slot.
LED_GREEN="/sys/class/leds/green:wan"

# Green LED 2: progress segment 34-66% / error-class slot.
LED_GREEN2="/sys/class/leds/green:lan-1"

# Green LED 3: progress segment 67-99% / device-unknown-class error slot
# (solid) / target-unconfigured slot (slow blink). "Target unconfigured"
# (TARGET_UUID left empty) and the device/anchor-identity error class both
# use G3, but distinguish by trigger: target-unconfigured is a SLOW BLINK
# with R untouched (led_state_unconfigured); the error class is SOLID with R
# also slow-blinking (led_state_error 3). See docs state table (issue #40 /
# PR #41 review finding 3).
LED_GREEN3="/sys/class/leds/green:lan-2"

# === File Filters ===
# Files/directories to exclude from backup

EXCLUDE_PATTERNS="
.Trash*
.Spotlight*
.fseventsd
System Volume Information
\$RECYCLE.BIN
.DS_Store
Thumbs.db
*.tmp
*.TMP
~*
"

# === Advanced Settings ===

# rsync extra options
# Add custom rsync flags here
RSYNC_EXTRA_OPTS=""

# Pre-backup hook script (optional)
# Run custom commands before backup starts
PRE_BACKUP_HOOK=""

# Post-backup hook script (optional)
# Run custom commands after backup completes
POST_BACKUP_HOOK=""
