<%+cbi/valueheader%>
<% local selected = self:cfgvalue(section) or self.default %>
<select class="cbi-input-select"<%=attr("id", cbid) .. attr("name", cbid)%>>
<% for index, key in ipairs(self.keylist) do %>
<option<%=attr("value", key) .. ifattr(key == selected, "selected", "selected")%>><%=pcdata(self.vallist[index])%></option>
<% end %>
</select>
<div<%=attr("id", cbid .. "-selection-data") .. attr("data-roots", luci.util.serialize_json(self.selection_roots)) .. attr("data-mounts", luci.util.serialize_json(self.selection_mounts))%>></div>
<p id="<%=pcdata(cbid)%>-selection-summary"></p>
<script type="text/javascript">
(function() {
    function ancestorWithClass(element, className) {
        while (element && element !== document.body) {
            if ((" " + element.className + " ").indexOf(" " + className + " ") !== -1) {
                return element;
            }
            element = element.parentNode;
        }
        return null;
    }

    var previousMount;
    var previousManualMount;

    // Follow only the conventional value. Custom or manually edited paths stay
    // untouched; the server still validates the full submitted configuration.
    function rebaseRoot(field, oldMount, newMount, child) {
        if (field && oldMount && newMount &&
            field.value === oldMount.replace(/\/+$/, '') + '/' + child) {
            field.value = newMount.replace(/\/+$/, '') + '/' + child;
        }
    }

    function updateTargetFields() {
        var selector = document.getElementById('<%=pcdata(cbid)%>');
        var data = document.getElementById('<%=pcdata(cbid)%>-selection-data');
        var summary = document.getElementById('<%=pcdata(cbid)%>-selection-summary');
        var roots;
        var manual;
        var fieldNames = [ 'target_mount', 'target_uuid', 'backup_root' ];
        var i;

        if (!selector || !data || !summary) {
            return;
        }

        roots = JSON.parse(data.getAttribute('data-roots'));
        manual = selector.value === 'manual';
        var prefix = 'cbid.outdoor-backup.<%=pcdata(section)%>.';
        var mount = document.getElementById(prefix + 'target_mount');
        var library = document.getElementById(prefix + 'library_root');
        var backup = document.getElementById(prefix + 'backup_root');
        var mounts = JSON.parse(data.getAttribute('data-mounts'));
        var currentMount = manual ? (mount && mount.value) : mounts[selector.value];
        rebaseRoot(library, previousMount, currentMount, 'MediaLibrary');
        if (manual && mount && mount.value) {
            rebaseRoot(backup, previousManualMount, mount.value, 'SDMirrors');
            previousManualMount = mount.value;
        }
        // Clearing an input must not discard the last root-matching anchor.
        if (currentMount) {
            previousMount = currentMount;
        }
        summary.textContent = manual ?
            'Manual mode: the fields below are saved as entered.' :
            'Selected target will save backup root: ' + (roots[selector.value] || 'unknown');

        for (i = 0; i < fieldNames.length; i++) {
            var field = document.getElementById('cbid.outdoor-backup.<%=pcdata(section)%>.' + fieldNames[i]);
            var row = ancestorWithClass(field, 'cbi-value');
            if (row) {
                row.style.display = manual ? '' : 'none';
            }
        }
    }

    window.addEventListener('load', function() {
        var selector = document.getElementById('<%=pcdata(cbid)%>');
        if (!selector) {
            return;
        }
        var mount = document.getElementById('cbid.outdoor-backup.<%=pcdata(section)%>.target_mount');
        if (mount) {
            if (mount.value) {
                previousMount = previousManualMount = mount.value;
            }
            mount.addEventListener('change', updateTargetFields);
            mount.addEventListener('input', updateTargetFields);
        }
        selector.addEventListener('change', updateTargetFields);
        updateTargetFields();
    });
}());
</script>
<%+cbi/valuefooter%>
