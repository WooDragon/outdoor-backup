<%+cbi/valueheader%>
<% local selected = self:cfgvalue(section) or self.default %>
<select class="cbi-input-select"<%=attr("id", cbid) .. attr("name", cbid)%>>
<% for index, key in ipairs(self.keylist) do %>
<option<%=attr("value", key) .. ifattr(key == selected, "selected", "selected")%>><%=pcdata(self.vallist[index])%></option>
<% end %>
</select>
<div<%=attr("id", cbid .. "-selection-data") .. attr("data-roots", luci.util.serialize_json(self.selection_roots))%>></div>
<p id="<%=pcdata(cbid)%>-selection-summary"></p>
<script type="text/javascript">
(function() {
    function ancestorWithClass(element, className) {
        while (element && element !== document.body) {
            if ((" " + element.className + " ").indexOf(" " + className + " ") !== -1) {
                return element;
            }
            element = element.parentNode;
        }
        return null;
    }

    function updateTargetFields() {
        var selector = document.getElementById('<%=pcdata(cbid)%>');
        var data = document.getElementById('<%=pcdata(cbid)%>-selection-data');
        var summary = document.getElementById('<%=pcdata(cbid)%>-selection-summary');
        var roots;
        var manual;
        var fieldNames = [ 'target_mount', 'target_uuid', 'backup_root' ];
        var i;

        if (!selector || !data || !summary) {
            return;
        }

        roots = JSON.parse(data.getAttribute('data-roots'));
        manual = selector.value === 'manual';
        summary.textContent = manual ?
            'Manual mode: the fields below are saved as entered.' :
            'Selected target will save backup root: ' + (roots[selector.value] || 'unknown');

        for (i = 0; i < fieldNames.length; i++) {
            var field = document.getElementById('cbid.outdoor-backup.<%=pcdata(section)%>.' + fieldNames[i]);
            var row = ancestorWithClass(field, 'cbi-value');
            if (row) {
                row.style.display = manual ? '' : 'none';
            }
        }
    }

    window.addEventListener('load', function() {
        var selector = document.getElementById('<%=pcdata(cbid)%>');
        if (!selector) {
            return;
        }
        selector.addEventListener('change', updateTargetFields);
        updateTargetFields();
    });
}());
</script>
<%+cbi/valuefooter%>
